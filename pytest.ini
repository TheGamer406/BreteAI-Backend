[pytest]
markers =
    contract: pega a APIs externas reales (docs/design.md §4). No corre en CI normal.
    golden: pega al LLM real, detecta regresiones de score (docs/design.md §4-B). Solo en el server con GPU.

# Por defecto excluye los tests de contrato y golden -- correrlos aparte con:
#   pytest -m contract
#   pytest -m golden
addopts = -m "not contract and not golden"
